# Build da imagem Docker e push no ECR (fcg/users-api).
#
# - pull_request: só builda, sem tocar na AWS (PRs de fork não recebem token OIDC).
# - push na main ou tag v*: roda build e testes unitários antes; se falharem, nada é publicado.
# - push na main: publica sha-<commit> (expira em 15 dias pela lifecycle policy do ECR).
# - push de tag v*: publica a tag de release (nunca expira; use esta em produção).
# - depois de todo push (main ou tag), o job deploy troca a imagem do users-api no
#   EKS (rolling update, zero downtime). Cluster desligado: o deploy é pulado, sem falhar.
#
# Credenciais: OIDC com a role fcg-gha-users-api, cujo ARN vem da variável de
# repositório AWS_ROLE_ARN. Nenhuma access key fica guardada no GitHub. A role e a
# trust policy vivem no IaC do FIAPCloudGames-fase4-Orchestration
# (infra/cloudformation/github-oidc.yaml).
name: ecr-push

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ecr-push-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fcg/users-api
  DOCKERFILE: src/FCG.API/Dockerfile
  # Cluster na AWS (o contexto local do kubectl se chama fcg-eks, o cluster é "fcg").
  EKS_CLUSTER: fcg
  K8S_NAMESPACE: fcg
  K8S_DEPLOYMENT: users-api
  K8S_CONTAINER: users-api

jobs:
  build:
    name: Build (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build da imagem
        run: docker build -f "$DOCKERFILE" -t "$ECR_REPOSITORY:pr-${{ github.event.number }}" .

  # Build & Test no push: a imagem só é publicada (e implantada) se os testes passarem.
  # Em PR quem testa é o test.yml (unitários, integração e container).
  test:
    name: Build e testes unitários
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restaurar e compilar
        run: |
          dotnet restore
          dotnet build --no-restore -c Release

      - name: Testes unitários
        run: |
          dotnet test tests/FCG.UnitTests --no-build -c Release

  push:
    name: Build e push no ECR
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # necessário para o OIDC
    # Só a tag: o registry leva o ID da conta, e o GitHub descarta output de job que
    # contenha valor mascarado. O job deploy remonta o endereço da imagem.
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Definir a tag da imagem
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Conferir a variável AWS_ROLE_ARN
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Variável de repositório AWS_ROLE_ARN não configurada (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # As tags do ECR são IMMUTABLE: um re-run do mesmo commit falharia no push.
      # Se a tag já existe, a imagem publicada é a deste commit e não há o que fazer.
      - name: Conferir se a tag já existe no ECR
        id: exists
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          if out=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" 2>&1); then
            echo "::notice::$ECR_REPOSITORY:$TAG já existe no ECR; push ignorado."
            echo "value=true" >> "$GITHUB_OUTPUT"
          elif grep -q ImageNotFoundException <<< "$out"; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            exit 1
          fi

      - name: Build e push
        if: steps.exists.outputs.value == 'false'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.value }}
        run: |
          docker build -f "$DOCKERFILE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  # Deploy no EKS. O cluster é efêmero (só fica ligado em testes e na gravação), então
  # cluster ou deployment ausente vira aviso, não erro. A role só lê o endereço do
  # cluster (eks:DescribeCluster) e, dentro dele, edita só o namespace fcg
  # (Orchestration: github-oidc.yaml e a access entry do eks.yaml).
  deploy:
    name: Deploy no EKS
    needs: push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # necessário para o OIDC
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Conferir se o cluster está ligado
        id: cluster
        run: |
          if out=$(aws eks describe-cluster --name "$EKS_CLUSTER" --query cluster.status --output text 2>&1); then
            if [ "$out" = "ACTIVE" ]; then
              echo "up=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Cluster $EKS_CLUSTER com status $out; deploy pulado."
              echo "up=false" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q ResourceNotFoundException <<< "$out"; then
            echo "::notice::Cluster $EKS_CLUSTER desligado; deploy pulado (a imagem já está no ECR)."
            echo "up=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            exit 1
          fi

      - name: Configurar o kubectl
        if: steps.cluster.outputs.up == 'true'
        env:
          TAG: ${{ needs.push.outputs.tag }}
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "IMAGE=$account.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$TAG" >> "$GITHUB_ENV"

      - name: Conferir se o deployment existe
        id: target
        if: steps.cluster.outputs.up == 'true'
        run: |
          if kubectl get "deployment/$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::deployment/$K8S_DEPLOYMENT não existe em $K8S_NAMESPACE; rode 'make workloads-deploy' no Orchestration. Deploy pulado."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # RollingUpdate com maxUnavailable: 0 (k8s/20-users-api.yaml): o pod novo só recebe
      # tráfego depois da readiness probe, e só então um antigo sai. Se o novo não ficar
      # pronto, os antigos continuam atendendo e o job falha no rollout status.
      - name: Atualizar a imagem e aguardar o rollout
        if: steps.target.outputs.exists == 'true'
        run: |
          kubectl set image "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=$IMAGE" -n "$K8S_NAMESPACE"
          kubectl annotate "deployment/$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --overwrite \
            kubernetes.io/change-cause="GitHub Actions $GITHUB_SHA ($IMAGE)"
          kubectl rollout status "deployment/$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout=5m

      - name: Resumo do deploy
        if: always() && steps.target.outputs.exists == 'true'
        run: |
          {
            echo "### Deploy no EKS"
            echo "Imagem: \`$IMAGE\`"
            echo '```'
            kubectl get pods -n "$K8S_NAMESPACE" -l "app=$K8S_DEPLOYMENT" -o wide
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
