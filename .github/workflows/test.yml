name: Testes Automatizados

on: pull_request

jobs:
  test:
    name: Execução de testes .NET
    runs-on: ubuntu-latest

    # PostgreSQL, Redis e LocalStack (SNS/SQS) são criados pelos próprios testes via
    # Testcontainers (o runner já tem Docker).
    steps:
      - uses: actions/checkout@v4

      - name: Configurando .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurando dependências
        run: dotnet restore

      - name: Compilando
        run: dotnet build --no-restore -c Release

      - name: Executando testes unitários
        run: dotnet test tests/FCG.UnitTests --no-build -c Release

      - name: Executando testes de integração
        run: dotnet test tests/FCG.IntegrationTests --no-build -c Release

  container-test:
    name: Execução de testes em container
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Construindo imagem Docker
        run: docker build -f src/FCG.API/Dockerfile -t fcg-users-api:ci .

      - name: Subindo dependências (PostgreSQL e Redis)
        run: |
          docker network create fcg
          docker run -d --name db --network fcg \
            -e POSTGRES_DB=fcgdb -e POSTGRES_USER=fcg -e POSTGRES_PASSWORD=fcg123 \
            --health-cmd "pg_isready -U fcg -d fcgdb" --health-interval 2s --health-retries 30 \
            postgres:16-alpine
          docker run -d --name redis --network fcg redis:7-alpine
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' db)" = "healthy" ] && exit 0
            sleep 2
          done
          echo "::error::PostgreSQL não ficou saudável a tempo."
          exit 1

      - name: Subindo a API
        run: |
          docker run -d --name api --network fcg -p 8080:8080 \
            -e ConnectionStrings__DefaultConnection="Host=db;Port=5432;Database=fcgdb;Username=fcg;Password=fcg123" \
            -e ConnectionStrings__Redis="redis:6379,abortConnect=false" \
            fcg-users-api:ci

      - name: Smoke test (login do admin seed)
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"email":"admin@fcg.com","password":"Admin@123"}' || true)
            [ "$status" = "200" ] && echo "API respondeu 200" && exit 0
            sleep 2
          done
          echo "::error::API não respondeu 200 no login (último status: $status)."
          exit 1

      - name: Logs da API
        if: always()
        run: docker logs api || true
